# ============================================================
# 本地开发环境数据库配置（模板）
# 复制本文件为 application-local.yml 并修改实际配置
# ============================================================

spring:
  # 主数据源 — 业务数据库
  datasource:
    url: jdbc:mysql://localhost:3306/zestflow_test_bussiness?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: your-db-username
    password: your-db-password
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

# 执行器数据源（默认复用主数据源）
zestflow:
  executor:
    datasource:
      url: jdbc:mysql://localhost:3306/zestflow_test_bussiness?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      username: your-db-username
      password: your-db-password
      driver-class-name: com.mysql.cj.jdbc.Driver
  collector:
    datasource:
      url: jdbc:mysql://localhost:3306/zestflow_test_log?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      username: your-db-username
      password: your-db-password
      driver-class-name: com.mysql.cj.jdbc.Driver
