# ============================================================
# 生产环境配置（模板）
# 复制本文件为 application-prod.yml 并按实际环境修改
# 启动方式：--spring.profiles.active=prod
# ============================================================

server:
  port: 8081

spring:
  application:
    name: demo-app
  datasource:
    # 主数据源 — 业务数据库
    url: jdbc:mysql://localhost:3306/zestflow_test_bussiness?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: your-db-username
    password: your-db-password
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: false

zestflow:
  executor:
    port: 20550
    execute-endpoint-enabled: false
    # 执行器数据源（默认复用主数据源）
    datasource:
      url: jdbc:mysql://localhost:3306/zestflow_test_bussiness?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      username: your-db-username
      password: your-db-password
      driver-class-name: com.mysql.cj.jdbc.Driver
    # Admin 服务地址
    admin-addresses: http://localhost:8080
  playground:
    # 当前服务的基础 URL（用于 Admin 试验场拼接完整请求路径）
    url: http://localhost:${server.port}
    scan-packages:
      - com.zestflow.test.controller
  collector:
    # 采集器数据源
    datasource:
      url: jdbc:mysql://localhost:3306/zestflow_test_log?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      username: your-db-username
      password: your-db-password
      driver-class-name: com.mysql.cj.jdbc.Driver
    registry:
      port: 20650
