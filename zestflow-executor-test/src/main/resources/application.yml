server:
  port: 8081
  # 演示业务 Tomcat 仅本机调试；对外（含 Admin 试验场）必须走 Executor Netty
  address: 127.0.0.1

spring:
  application:
    name: demo-app
  config:
    import: optional:classpath:application-local.yml
  # 禁用 Flyway（所有 DDL 在 init.sql 中管理）
  flyway:
    enabled: false

zestflow:
  executor:
    port: 20550
    execute-endpoint-enabled: true
    # 与 Admin zestflow.admin.registry-token 保持一致（本地开发可留空）
    registry-token:
    # 嵌入模式：Executor 侧异步发布事件；Collector 侧建议同步写入（见下方 collector.async-enabled）
    event:
      async-enabled: true
  playground:
    scan-packages:
      - com.zestflow.test.controller
    # 演示业务 Tomcat 基址（试验场业务 API 全路径展示与 Tomcat 通道）
    url: http://127.0.0.1:8081
  collector:
    # 与 starter 一致：关闭 Collector 二层 async，避免双队列
    async-enabled: false
    registry:
      port: 20650

# Phase 2a — Spring Boot Actuator + Micrometer（对标 Prometheus/Grafana）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    distribution:
      percentiles-histogram:
        zestflow.chain.duration: true
      percentiles:
        zestflow.chain.duration: 0.5,0.95,0.99,0.999
