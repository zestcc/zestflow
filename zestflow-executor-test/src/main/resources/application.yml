  # 日志数据源 — 事件存储
  log:
    datasource:
      jdbc-url: jdbc:mysql://localhost:3306/zestflow_test_log?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      username: root
      password: It10241024xw
      driver-class-name: com.mysql.cj.jdbc.Driver
    flyway:
      enabled: true
      locations: classpath:db/migration/log
      baseline-on-migrate: true
      baseline-version: 1
      table: flyway_schema_history_log
