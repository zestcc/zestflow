server:
  port: 8081

spring:
  application:
    name: test-executor
  # 主数据源 — 业务数据库
  datasource:
    url: jdbc:mysql://localhost:3306/zestflow_test_bussiness?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  # 禁用 Flyway（所有 DDL 在 init.sql 中管理）
  flyway:
    enabled: false

# 执行器数据源（默认复用主数据源，此处显式指定同一业务库）
zestflow:
  executor:
    datasource:
      url: jdbc:mysql://localhost:3306/zestflow_test_bussiness?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      username: root
      password: 123456
      driver-class-name: com.mysql.cj.jdbc.Driver
  collector:
    datasource:
      url: jdbc:mysql://localhost:3306/zestflow_test_log?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      username: root
      password: 123456
      driver-class-name: com.mysql.cj.jdbc.Driver
