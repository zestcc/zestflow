server:
  port: 8081

spring:
  application:
    name: test-executor
  # 主数据源 — 业务数据库
  datasource:
    url: jdbc:mysql://localhost:3306/zestflow_test_bussiness?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: It10241024xw
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
