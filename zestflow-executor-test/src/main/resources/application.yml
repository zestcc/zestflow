server:
  port: 8081
  # 演示业务 Tomcat 仅本机调试；对外（含 Admin 试验场）必须走 Executor Netty
  address: 127.0.0.1

spring:
  application:
    name: demo-app
  config:
    import: optional:classpath:application-local.yml
  # 禁用 Flyway（所有 DDL 在 init.sql 中管理）
  flyway:
    enabled: false

zestflow:
  executor:
    port: 20550
    execute-endpoint-enabled: true
    # 与 Admin zestflow.admin.registry-token 保持一致（本地开发可留空）
    registry-token:
  playground:
    scan-packages:
      - com.zestflow.test.controller
  collector:
    registry:
      port: 20650
