server:
  port: 8081

spring:
  application:
    name: test-executor
  # 主数据源 — 业务数据库（H2 内存模式）
  datasource:
    url: jdbc:h2:mem:test_business;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  # 禁用 Flyway
  flyway:
    enabled: false
  # H2 web console
  h2:
    console:
      enabled: true

# 数据源配置
zestflow:
  executor:
    datasource:
      url: jdbc:h2:mem:test_business;DB_CLOSE_DELAY=-1;MODE=MySQL
      username: sa
      password:
      driver-class-name: org.h2.Driver
    admin-addresses:
    module-code: test-executor
    host: localhost
    port: 0
    execute-endpoint-enabled: false
    event:
      queue-capacity: 8192
      batch-size: 200
      batch-max-wait-ms: 200
  collector:
    datasource:
      url: jdbc:h2:mem:test_log;DB_CLOSE_DELAY=-1;MODE=MySQL
      username: sa
      password:
      driver-class-name: org.h2.Driver
