# ============================================================
# ZestFlow Executor 默认配置
# 引入 zestflow-executor 依赖后自动生效，业务项目可在自己的
# application.yml 中覆盖以下任意属性。
# ============================================================
zestflow:
  executor:
    # 应用编码（为空则使用 spring.application.name）
    app-code:
    # 应用名称（为空则默认等于 app-code）
    app-name:
    # Admin 服务地址，多个用逗号分隔
    admin-addresses: http://localhost:8080
    # 认证令牌（Netty 端点 X-Access-Token，与 Admin 端共享）
    access-token:
    # Admin 机器接口令牌（注册/心跳/链同步，请求头 X-Registry-Token，须与 Admin zestflow.admin.registry-token 一致）
    registry-token:
    # 心跳间隔（秒）
    heartbeat-interval: 30
    # 执行器暴露的 Host（为空则自动探测本机 IP）
    host:
    # 执行器暴露的 Port（Netty 服务端端口）
    port: 20550
    # 统一执行端点开关（true 则在 Web 端口注册 POST /execute、/api/execute）
    execute-endpoint-enabled: false
    # 链 HTTP 路由（Mode 2：chainData.config.http.path 别名，优先级低于已有 @RequestMapping）
    chain-route-enabled: false
    # 成功响应模式：BODY=PARSER 返回值，DETAIL=完整执行明细（仅 Tomcat Mode 1/2，见 executeHttp）
    execute-response-mode: BODY
    # Netty POST /execute 固定 DETAIL（完整 ChainExecuteResultDTO），不受 execute-response-mode 影响；Admin 试验场依赖 instanceId/nodeResults
    # 失败策略：PROPAGATE=抛 ChainExecutionException，ERROR_HANDLER=调 errorHandler 元件，WRAPPED=success:false
    execute-failure-policy: PROPAGATE
    # 注册/心跳请求超时（毫秒）
    timeout-ms: 5000

    # ---- 数据源（可选，不配置则复用业务主数据源） ----
    # datasource:
    #   url: jdbc:mysql://localhost:3306/zestflow_executor?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    #   username: root
    #   password: 123456
    #   driver-class-name: com.mysql.cj.jdbc.Driver

    # ---- 事件采集配置（实际生效项见 zestflow.collector.*，由 collector-jdbc 模块绑定） ----
    # event:
    #   queue-capacity: 8192
    #   batch-size: 200
    #   batch-max-wait-ms: 500
    #   circuit-breaker-threshold: 10
    #   circuit-breaker-cooldown-ms: 30000
    #   disk-fallback-enabled: false
    #   disk-fallback-dir: ./collector-fallback
    #   disk-replay-interval-ms: 5000

    # ---- 链执行配置 ----
    chain:
      # 链加载重试次数
      load-retry-times: 3
      # 链加载重试间隔（毫秒）
      load-retry-interval-ms: 5000
      # 是否启用自动热更新
      auto-reload: true
      # 热更新检查间隔（毫秒）
      reload-check-interval-ms: 60000
      # 同层并行节点数上限
      parallel-threshold: 3
      # 数据持久化目录
      data-dir: ./zestflow-data
      # 链默认超时（毫秒）
      default-timeout-ms: 60000
      # 节点默认重试次数
      node-default-retry-count: 0
      # 节点默认重试间隔（毫秒）
      node-default-retry-interval-ms: 1000

    # ---- Netty /execute 业务线程池（避免阻塞 EventLoop，对标 xxl-job 业务线程池） ----
    # 核心线程数（0 表示 CPU 核数）
    execute-pool-core-size: 0
    # 最大线程数（0 表示 CPU 核数 × 2）
    execute-pool-max-size: 0
    # 队列容量
    execute-pool-queue-capacity: 256

  # ---- 试验场 / 端点扫描 ----
  playground:
    # 控制器扫描包（端点导入白名单，空则不限制）
    scan-packages: []
    # 业务 API 对外基址（Tomcat/网关）。配置后试验场业务调用与端点展示走此地址；未配置由 Admin 拼接
    url:
