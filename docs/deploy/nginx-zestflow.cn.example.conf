# ZestFlow Admin 公网 Nginx 示例（www.zestflow.cn）
#
# 要点：
# - 公网仅 443；Admin Tomcat 监听 127.0.0.1:8080
# - Admin REST API 统一前缀 /api/zestflow（见 AdminApiPaths）
# - 扫描器常见的 /api/lottery、/wap/ 等在 Nginx 直接 404，不进 Java
# - SPA、静态资源、uploads 仍反代到 Admin

server {
    listen 80;
    server_name www.zestflow.cn zestflow.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name www.zestflow.cn zestflow.cn;

    ssl_certificate     /opt/module/ssl/ssl-zestflow/fullchain.pem;
    ssl_certificate_key /opt/module/ssl/ssl-zestflow/privkey.pem;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;
    client_max_body_size 10m;

    # 爬虫/浏览器常见探测，本地应答
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /favicon.ico {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # 非 ZestFlow Admin API 的 /api/* 路径（扫描器噪音）直接挡在 Nginx
    location ~ ^/api/(?!zestflow/) {
        return 404;
    }

    # Admin REST API
    location /api/zestflow/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # SPA + 静态资源
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
