# Layer A：单元测试 + 全模块编译（无需 MySQL / 运行时服务）
# Layer B/C（黑盒 / 多租户 / IP 演示）见 docs/RELEASE_READINESS.md，本地或自建 Runner 执行 run-enterprise-gate.ps1

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests (Layer A)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Test zestflow-common
        run: mvn -B test -pl zestflow-common

      - name: Test zestflow-executor
        run: mvn -B test -pl zestflow-executor -am

      - name: Test zestflow-demo
        run: mvn -B test -pl zestflow-demo -am

      - name: Test collector-jdbc
        run: mvn -B test -pl zestflow-collector/collector-jdbc -am

      - name: Test zestflow-admin
        run: mvn -B test -pl zestflow-admin -am

      - name: Test zestflow-mcp
        run: mvn -B test -pl zestflow-mcp -am

  build:
    name: Package (skip tests)
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Package all modules
        run: mvn -B package -DskipTests

      - name: Upload admin JAR
        uses: actions/upload-artifact@v4
        with:
          name: zestflow-admin-jar
          path: zestflow-admin/target/zestflow-admin-*.jar
          if-no-files-found: error
          retention-days: 7
