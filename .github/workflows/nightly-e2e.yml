# GitHub Actions — 可选 Layer B～D 验收（需 self-hosted runner + 已启动 Admin/demo/Collector）
name: Nightly E2E

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: read

jobs:
  production-acceptance:
    name: Production Acceptance (Windows)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Layer A — unit tests
        run: mvn -B test

      - name: Layer B～D — runtime acceptance (skip if services down)
        shell: pwsh
        run: |
          ./scripts/blackbox/run-production-acceptance.ps1 -SkipMavenTest -AllowSkipRuntime
        continue-on-error: true

      - name: Upload acceptance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-reports
          path: scripts/blackbox/results/*.json
          if-no-files-found: ignore
