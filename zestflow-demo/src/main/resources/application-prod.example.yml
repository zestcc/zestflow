# ============================================================
# 生产环境配置（模板）— 业务应用（含 Executor + 嵌入式 Collector）
# 复制为 application-prod.yml，启动：--spring.profiles.active=prod
# ============================================================

server:
  port: 8081
  # 业务 Tomcat 仅内网；公网只暴露 Admin :8080
  address: 127.0.0.1

spring:
  application:
    name: demo-app
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/zestflow_app_bussiness?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&tcpKeepAlive=true
    username: your-db-username
    password: your-db-password
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1740000
      keepalive-time: 120000
  flyway:
    enabled: false

zestflow:
  executor:
    port: 20550
    # 公网关闭 Spring MVC /execute，仅 Admin 经 Netty 回调
    execute-endpoint-enabled: false
    chain-route-enabled: false
    execute-response-mode: BODY
    execute-failure-policy: PROPAGATE
    # 未配置 url 时回落 spring.datasource；分库/云 RDS 时单独指定
    datasource:
      url: jdbc:mysql://127.0.0.1:3306/zestflow_app_bussiness?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&tcpKeepAlive=true
      username: your-db-username
      password: your-db-password
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 8
        minimum-idle: 2
        connection-timeout: 10000
        idle-timeout: 600000
        max-lifetime: 1740000
        keepalive-time: 120000
    admin-addresses: http://127.0.0.1:8080
    registry-token: change-me-registry-token-min-16-chars
    access-token: change-me-executor-access-token-min-16
    timeout-ms: 5000
    execute-pool-core-size: 8
    execute-pool-max-size: 16
    execute-pool-queue-capacity: 256
    chain:
      declaration-sync-enabled: true
      declaration-delete-guard-enabled: true
    expression:
      timeout-ms: 5000
      max-script-length: 10000
      max-cache-size: 1000
      max-loop-count: 10000
      condition-fail-open: false
      clear-cache-on-chain-reload: true
    # 生产环境按需启用 Executor LLM（Ollama / OpenAI 兼容）
    ai:
      llm-enabled: false
      base-url: http://127.0.0.1:11434/v1
      model: llama3.2
      embedding-model: nomic-embed-text
      rag-mode: hybrid
      rag-use-embedding: true
      pattern-fallback-enabled: true
  collector:
    datasource:
      url: jdbc:mysql://127.0.0.1:3306/zestflow_app_log?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&tcpKeepAlive=true
      username: your-db-username
      password: your-db-password
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 8
        minimum-idle: 2
        connection-timeout: 10000
        idle-timeout: 600000
        max-lifetime: 1740000
        keepalive-time: 120000
    registry:
      port: 20650
      admin-addresses: http://127.0.0.1:8080
      registry-token: change-me-registry-token-min-16-chars
    access-token: change-me-collector-access-token-min-16
    disk-fallback-enabled: true
