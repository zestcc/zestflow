<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邮箱验证</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f6f9;font-family:'Helvetica Neue',Arial,sans-serif;">
<table role="presentation" style="width:100%;background-color:#f4f6f9;padding:40px 0;">
    <tr>
        <td align="center">
            <table role="presentation" style="width:600px;max-width:100%;background-color:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.08);">
                <tr>
                    <td style="padding:40px 40px 20px;text-align:center;background:linear-gradient(135deg,#4a5fc1,#667eea);">
                        <h1 style="color:#ffffff;margin:0;font-size:24px;font-weight:600;">ZestFlow</h1>
                        <p style="color:rgba(255,255,255,0.85);margin:8px 0 0;font-size:14px;">业务流程编排引擎</p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:32px 40px;">
                        <p style="margin:0 0 16px;font-size:15px;color:#333;">尊敬的 <strong th:text="${username}">用户</strong>：</p>
                        <p style="margin:0 0 16px;font-size:15px;color:#555;line-height:1.6;">
                            感谢您注册 ZestFlow，请点击下方按钮验证您的邮箱地址。
                        </p>
                        <table role="presentation" style="width:100%;margin:24px 0;">
                            <tr>
                                <td align="center">
                                    <a th:href="${actionUrl}" style="display:inline-block;padding:12px 36px;background:linear-gradient(135deg,#4a5fc1,#667eea);color:#ffffff;text-decoration:none;border-radius:6px;font-size:15px;font-weight:500;">验证邮箱</a>
                                </td>
                            </tr>
                        </table>
                        <p style="margin:0 0 16px;font-size:13px;color:#999;line-height:1.6;">
                            或复制以下链接到浏览器地址栏打开：<br>
                            <a th:href="${actionUrl}" th:text="${actionUrl}" style="color:#667eea;word-break:break-all;">验证链接</a>
                        </p>
                        <p style="margin:16px 0 0;font-size:13px;color:#999;line-height:1.6;">
                            此链接将在 <strong th:text="${expireHours}">24</strong> 小时后失效。<br>
                            如果您没有注册 ZestFlow，请忽略此邮件。
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:20px 40px;background-color:#fafafa;border-top:1px solid #eee;">
                        <p style="margin:0;font-size:12px;color:#aaa;text-align:center;">ZestFlow 自动发送，请勿直接回复</p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
