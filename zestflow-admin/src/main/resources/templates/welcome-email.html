<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账号开通通知</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f6f9;font-family:'Helvetica Neue',Arial,sans-serif;">
<table role="presentation" style="width:100%;background-color:#f4f6f9;padding:40px 0;">
    <tr>
        <td align="center">
            <table role="presentation" style="width:600px;max-width:100%;background-color:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.08);">
                <tr>
                    <td style="padding:40px 40px 20px;text-align:center;background:linear-gradient(135deg,#4a5fc1,#667eea);">
                        <h1 style="color:#ffffff;margin:0;font-size:24px;font-weight:600;">ZestFlow</h1>
                        <p style="color:rgba(255,255,255,0.85);margin:8px 0 0;font-size:14px;">业务流程编排引擎</p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:32px 40px;">
                        <p style="margin:0 0 16px;font-size:15px;color:#333;">您好：</p>
                        <p style="margin:0 0 16px;font-size:15px;color:#555;line-height:1.6;">
                            您的 ZestFlow 账号已开通，请使用以下信息登录：
                        </p>
                        <table role="presentation" style="width:100%;margin:20px 0;background-color:#f8f9fb;border-radius:6px;padding:20px;">
                            <tr>
                                <td style="font-size:14px;color:#666;padding:4px 0;">登录地址：</td>
                                <td style="font-size:14px;color:#333;padding:4px 0;">
                                    <a th:href="${loginUrl}" th:text="${loginUrl}" style="color:#667eea;">登录链接</a>
                                </td>
                            </tr>
                            <tr>
                                <td style="font-size:14px;color:#666;padding:4px 0;width:80px;">用户名：</td>
                                <td style="font-size:14px;color:#333;padding:4px 0;font-weight:600;" th:text="${username}">username</td>
                            </tr>
                            <tr>
                                <td style="font-size:14px;color:#666;padding:4px 0;">密码：</td>
                                <td style="font-size:14px;color:#333;padding:4px 0;font-weight:600;" th:text="${password}">password</td>
                            </tr>
                        </table>
                        <p style="margin:16px 0 0;font-size:13px;color:#e6a23c;line-height:1.6;">
                            ⚠ 为保证账号安全，首次登录后请立即修改密码。
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:20px 40px;background-color:#fafafa;border-top:1px solid #eee;">
                        <p style="margin:0;font-size:12px;color:#aaa;text-align:center;">ZestFlow 自动发送，请勿直接回复</p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
