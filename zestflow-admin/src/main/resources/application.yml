server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: zestflow-admin
  config:
    import: optional:classpath:application-local.yml
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  mvc:
    locale-resolver: accept-header
  mail:
    host: smtp.example.com
    port: 587
    username:
    password:
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  flyway:
    enabled: false

zestflow:
  jwt:
    secret: ZestFlow_admin_2024_JWT_Secret_Key_Must_Be_At_Least_256_Bits_Long_!!_
    expiration: 86400000
  upload:
    avatar-dir: uploads/avatars
  admin:
    tenant-id: 1
    system-user: sys
    default-user:
      username: admin
      password: admin123
      email: admin@zestflow.com
  playground:
    # 开关：true 启用系统演示功能（含演示场景、演示记录、试验场），false 关闭（默认关闭）
    enabled: true
    # 演示链所属应用编码（Executor 注册时使用的 appCode）
    app-code: playground-app
  collector:
    api-url: http://localhost:8081
    access-token: ''

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.zestflow.admin.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.zestflow: debug
