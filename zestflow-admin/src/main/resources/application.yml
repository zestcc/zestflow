server:
  port: 8080

spring:
  application:
    name: zestflow-admin
  config:
    import: optional:classpath:application-local.yml
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  mvc:
    locale-resolver: accept-header
  mail:
    # 以下连接配置在 application-local.yml 中按环境覆盖
    host: ''
    port: 465
    username: ''
    password: ''
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  flyway:
    enabled: false
  thymeleaf:
    enabled: false

zestflow:
  jwt:
    # 生产环境在 application-local.yml 或环境变量中覆盖
    secret: ZestFlow_dev_JWT_Secret_Key_Change_Me_In_Production_!!_
    expiration: 86400000
  upload:
    avatar-dir: uploads/avatars
  admin:
    tenant-id: 1
    system-user: sys
    default-user:
      username: admin
      password: admin123
      email: admin@zestflow.com
    cache:
      # 缓存类型：simple（默认，零依赖）/ caffeine（生产本地）/ redis（集群）
      # 本地开发在 application-local.yml 中覆盖为 simple
      type: caffeine
      # Caffeine 最大条目数
      maximum-size: 10000
      # 缓存 TTL（秒）
      ttl-seconds: 60
  tenant:
    # 租户模式：single（单租户）/ multi（多租户）
    mode: single
    # IP 演示模式：disabled / enabled
    ip-demo-mode: disabled
    # IP 租户非活跃超时（分钟）
    ip-tenant-timeout-minutes: 60
  playground:
    # 开关：true 启用系统演示功能（含演示场景、演示记录、试验场），false 关闭（默认关闭）
    enabled: true
    # 演示链所属应用编码（Executor 注册时使用的 appCode）
    app-code: playground-app
  collector:
    api-url: http://localhost:8081
    access-token: ''

  mail:
    # 总开关：false 时不执行真实邮件发送，MailService 由 NoopMailService 兜底
    # 生产环境在 application-local.yml 中覆盖为 true
    enabled: false
    # 前端访问地址（用于拼接重置/验证链接）
    base-url: ${APP_BASE_URL:http://localhost:8080}
    # 发件人显示名称
    from-name: "ZestFlow"
    reset-password:
      subject: "ZestFlow - 密码重置"
    verify-email:
      subject: "ZestFlow - 邮箱验证"

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.zestflow.admin.model.entity
  configuration:
    map-underscore-to-camel-case: true
    # 本地开发在 application-local.yml 中取消注释以打印 SQL
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    # 生产环境建议 info，本地开发在 application-local.yml 中覆盖为 debug
    com.zestflow: info
