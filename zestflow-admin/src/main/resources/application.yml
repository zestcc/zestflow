server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: zestflow-admin
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  mvc:
    locale-resolver: accept-header
  datasource:
    url: jdbc:mysql://localhost:3306/zestflow_admin?useUnicode=true&characterEncoding=utf-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 10000
  mail:
    host: smtp.example.com
    port: 587
    username:
    password:
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  flyway:
    enabled: false

zestflow:
  jwt:
    secret: ZestFlow_admin_2024_JWT_Secret_Key_Must_Be_At_Least_256_Bits_Long_!!_
    expiration: 86400000
  upload:
    avatar-dir: uploads/avatars
  admin:
    tenant-id: 1
    system-user: sys
    default-user:
      username: admin
      password: admin123
      email: admin@zestflow.com
  playground:
    # 开关：true 启用演示调试功能，false 关闭（默认关闭）
    enabled: true
    # 演示链所属应用编码（Executor 注册时使用的 appCode）
    app-code: demo-app
    # 每 IP 每分钟允许的最大请求数
    rate-limit: 30
    # 演示场景定义
    scenes:
      - id: hello
        name: Hello World
        chain-code: CHN_DEMO_HELLO
        description: 3 节点最小链路，体验链执行全流程
        default-params:
          message: "Hello ZestFlow"
      - id: order
        name: 订单处理
        chain-code: CHN_DEMO_ORDER
        description: 含条件分支的订单处理链路，展示分支能力
        default-params:
          orderId: "ORD001"
          amount: "99.90"
          userId: "U10086"
      - id: payment
        name: 支付全流程
        chain-code: CHN_DEMO_PAYMENT
        description: 12 节点支付链路，展示全链路可观测
        default-params:
          orderId: "ORD002"
          amount: "299.00"
      - id: stress-50
        name: 50 步压力链
        chain-code: CHN_DEMO_STRESS_50
        description: 50 个串行节点，展示极端链路执行效果
        default-params:
          input: "stress-test"
  collector:
    api-url: http://localhost:8081
    access-token: ''

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.zestflow.admin.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.zestflow: debug
