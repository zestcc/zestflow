# ============================================================
# 生产环境配置（模板 — 复制为 application-prod.yml 后修改）
# 启动：--spring.profiles.active=prod
#
# 一键部署包（含自动生成密钥）：
#   mvn package -pl zestflow-admin -Pdist -DskipTests
#   或 powershell -File scripts/deploy/package-admin.ps1
#   产物：deploy/zestflow_admin_{version}_linux|win/
#
# 数据库：自行 CREATE DATABASE zestflow_admin → 改 spring.datasource → 启动时 Flyway migrate。
# 表结构单轨维护于 classpath:db/migration/V*.sql；勿改已发布 V* 脚本。
#
# prod profile 启动时 AdminProductionGuard 硬性校验：
#   - JWT secret（≥32 字符，非 dev 默认值）
#   - default-user.password（禁止 admin123 / change-me）
#   - playground.enabled=false、tenant.ip-demo-mode=disabled
# ============================================================

server:
  address: 127.0.0.1
  port: 8080

spring:
  application:
    name: zestflow-admin
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  mvc:
    locale-resolver: accept-header
  datasource:
    # 单机本地：127.0.0.1 + useSSL=false；非 3306 端口须与 my.cnf 一致（如 2882）
    url: jdbc:mysql://127.0.0.1:3306/zestflow_admin?useUnicode=true&characterEncoding=utf-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&tcpKeepAlive=true
    username: root
    # 口令含 ! @ # 等 YAML 特殊字符时必须加引号，例如 password: "!Fy@xxx"
    password: "root"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1740000
      keepalive-time: 120000
  mail:
    host: smtp.your-email.com
    port: 465
    username: your-email@your-email.com
    password: your-email-auth-code
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.ssl.trust: smtp.your-email.com
      mail.smtp.socketFactory.class: javax.net.ssl.SSLSocketFactory
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true
  thymeleaf:
    enabled: false

zestflow:
  jwt:
    # 至少 32 字符；部署包由 application-secrets.yml / config/secret 自动生成
    secret: change-me-use-openssl-rand-base64-32-or-longer-secret
    expiration: 86400000
  sso:
    enabled: false
    provider: zest-sso
    issuer: https://sso.example.com
    discovery-uri: https://sso.example.com/api/public/.well-known/openid-configuration
    client-id: zestflow-admin
    client-secret: change-me-sso-client-secret
    redirect-uri: https://admin.example.com/login/callback
    jwks-uri: https://sso.example.com/oauth2/jwks
    scopes: openid,profile,email,roles,tenant
    post-logout-redirect-uri: https://admin.example.com/login
    claims:
      username-claim: preferred_username
      email-claim: email
      roles-claim: roles
      tenant-claim: tenant_id
      admin-role: SSO_ADMIN
    zest-sso:
      use-logout-url-api: true
  upload:
    avatar-dir: uploads/avatars
  admin:
    # 内网 http；公网经 Nginx 终止 TLS 后改为 https
    protocol: http
    cors:
      allowed-origins: http://127.0.0.1:8080,http://localhost:8080,https://www.zestflow.cn,https://zestflow.cn
    http-timeout-ms: 5000
    # 三台机器令牌须成对一致（Admin / Executor / Collector）
    registry-token: change-me-registry-token-min-16-chars
    executor-access-token: change-me-executor-access-token-min-16
    deploy-mode: standalone
    tenant-id: 1
    system-user: sys
    default-user:
      username: admin
      password: change-me-strong-admin-password
      email: admin@localhost
    cache:
      type: caffeine
      maximum-size: 10000
      ttl-seconds: 60
    runtime-state:
      ttl-seconds: 300
    health-probe:
      enabled: true
      executor-path: /health
      collector-path: /collector/health
      timeout-ms: 1500
    reconcile:
      enabled: true
      interval-ms: 120000
  tenant:
    mode: single
    ip-demo-mode: disabled
    ip-tenant-timeout-minutes: 60
  playground:
    enabled: false
  collector:
    api-url: http://127.0.0.1:20650
    access-token: change-me-collector-access-token-min-16
  mail:
    # 无 SMTP 时保持 false；有邮件服务再开启
    enabled: false
    base-url: http://127.0.0.1:8080
    from-name: "ZestFlow"
    reset-password:
      subject: "ZestFlow - 密码重置"
    verify-email:
      subject: "ZestFlow - 邮箱验证"

management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health.show-details: when-authorized
  endpoint.health.show-components: when-authorized
  endpoint.health.probes.enabled: true
  health.mail.enabled: false

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.zestflow.admin.model.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.zestflow: info

# 生产环境关闭 OpenAPI（AdminProductionGuard 强制校验）
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Redis（多 Admin 副本 deploy-mode=cluster 时启用，须 mvn -Pcluster 构建）：
# spring.data.redis.host / port / password
# zestflow.admin.deploy-mode: cluster
# zestflow.admin.cache.type: redis
