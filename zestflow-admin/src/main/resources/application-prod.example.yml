# ============================================================
# 生产环境配置（模板）
# 复制本文件为 application-prod.yml 并按实际环境修改
# 启动方式：--spring.profiles.active=prod
#
# prod profile 启动时会执行 AdminProductionGuard 硬性校验：
#   - registry / executor / collector 令牌（≥16 字符，非 your-* 占位符）
#   - JWT secret（≥32 字符，非 dev 默认值）
#   - default-user.password（禁止 admin123）
#   - playground.enabled=false、tenant.ip-demo-mode=disabled
# ============================================================

server:
  port: 8080

spring:
  application:
    name: zestflow-admin
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  mvc:
    locale-resolver: accept-header
  datasource:
    # 生产推荐 useSSL=true 并配置 truststore；内网专线可按实际调整
    url: jdbc:mysql://localhost:3306/zestflow_admin?useUnicode=true&characterEncoding=utf-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=true
    username: your-db-username
    password: your-db-password
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 10000
  mail:
    host: smtp.your-email.com
    port: 465
    username: your-email@your-email.com
    password: your-email-auth-code
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.ssl.trust: smtp.your-email.com
      mail.smtp.socketFactory.class: javax.net.ssl.SSLSocketFactory
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  thymeleaf:
    enabled: false

zestflow:
  jwt:
    # 至少 32 字符随机串；勿使用 application.yml 中的 dev 默认值
    secret: change-me-use-openssl-rand-base64-32-or-longer-secret
    expiration: 86400000
  upload:
    avatar-dir: uploads/avatars
  admin:
    # 反向代理终止 TLS 时可设为 https
    protocol: https
    # 前端 module script 带 Origin 头；公网域名须加入 CORS 白名单（未升级 jar 前必配）
    cors:
      allowed-origins: https://www.zestflow.cn,https://zestflow.cn
    # 三台机器令牌须成对一致（Admin / Executor / Collector），各生成独立强随机串
    registry-token: change-me-registry-token-min-16-chars
    executor-access-token: change-me-executor-access-token-min-16
    deploy-mode: standalone
    tenant-id: 1
    system-user: sys
    default-user:
      username: admin
      # 首次建库 bootstrap 口令；禁止使用 admin123（prod 启动会拒绝）
      password: change-me-strong-admin-password
      email: admin@your-domain.com
    cache:
      type: caffeine
      maximum-size: 10000
      ttl-seconds: 60
    runtime-state:
      ttl-seconds: 300
    health-probe:
      enabled: true
      timeout-ms: 1500
  tenant:
    mode: single
    ip-demo-mode: disabled
    ip-tenant-timeout-minutes: 60
  playground:
    enabled: false
  collector:
    api-url: http://127.0.0.1:20650
    access-token: change-me-collector-access-token-min-16
  mail:
    enabled: true
    base-url: https://your-domain.com
    from-name: "ZestFlow"
    reset-password:
      subject: "ZestFlow - 密码重置"
    verify-email:
      subject: "ZestFlow - 邮箱验证"

management:
  endpoints.web.exposure.include: health,info,metrics
  endpoint.health.show-details: when-authorized
  endpoint.health.show-components: when-authorized
  endpoint.health.probes.enabled: true
  health.mail.enabled: false

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.zestflow.admin.model.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.zestflow: info

# Redis（按需 — 多 Admin 副本 deploy-mode=cluster 时启用，须 mvn -Pcluster 构建）：
# spring.data.redis.host / port / password
# zestflow.admin.deploy-mode: cluster
# zestflow.admin.cache.type: redis
