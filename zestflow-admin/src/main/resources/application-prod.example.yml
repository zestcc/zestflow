# ============================================================
# 生产环境配置（模板）
# 复制本文件为 application-prod.yml 并按实际环境修改
# 启动方式：--spring.profiles.active=prod
# ============================================================

server:
  port: 8080

spring:
  application:
    name: zestflow-admin
  # application-local.yml 通过 application.yml 的 optional import 加载，不存在时跳过
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  mvc:
    locale-resolver: accept-header
  datasource:
    url: jdbc:mysql://localhost:3306/zestflow_admin?useUnicode=true&characterEncoding=utf-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: your-db-username
    password: your-db-password
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 10000
  mail:
    host: smtp.your-email.com
    port: 465
    username: your-email@your-email.com
    password: your-auth-code
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.ssl.trust: smtp.your-email.com
      mail.smtp.socketFactory.class: javax.net.ssl.SSLSocketFactory
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  flyway:
    enabled: false
  thymeleaf:
    enabled: false

zestflow:
  jwt:
    secret: your-jwt-secret-must-be-at-least-256-bits-long
    expiration: 86400000
  upload:
    avatar-dir: uploads/avatars
  admin:
    # 内部服务间通信协议（http/https），生产环境如用反向代理 SSL 可改为 https
    protocol: http
    registry-token: your-registry-token
    # 与 zestflow.executor.access-token 一致
    executor-access-token: your-executor-access-token
    # deploy-mode：运行时状态 — standalone / cluster（多 Admin 副本）
    deploy-mode: standalone
    tenant-id: 1
    system-user: sys
    default-user:
      username: admin
      password: admin123
      email: admin@example.com
    cache:
      type: caffeine
      maximum-size: 10000
      ttl-seconds: 60
    runtime-state:
      # 仅 deploy-mode=cluster 时生效
      ttl-seconds: 300
  tenant:
    # 租户模式：single（单租户）/ multi（多租户）
    mode: single
    # IP 演示模式：disabled / enabled
    ip-demo-mode: disabled
    # IP 租户非活跃超时（分钟）
    ip-tenant-timeout-minutes: 60
  playground:
    # 开关：true 启用系统演示功能（含演示场景、演示记录、试验场）
    enabled: true
  collector:
    # Collector 地址通过注册表自动发现；无注册时可配置 api-url 兜底
    api-url: http://your-collector-host:20650
    access-token: ''
  mail:
    # 总开关：启用邮件发送
    enabled: true
    # 前端访问域名（用于拼接重置/验证链接）
    base-url: http://your-domain.com
    from-name: "ZestFlow"
    reset-password:
      subject: "ZestFlow - 密码重置"
    verify-email:
      subject: "ZestFlow - 邮箱验证"

management:
  endpoints.web.exposure.include: health,info,metrics
  endpoint.health.show-details: when-authorized
  endpoint.health.probes.enabled: true

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.zestflow.admin.model.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.zestflow: info

# Redis（按需启用，单机 standalone + cache.type=caffeine 可整段省略）：
#   deploy-mode=cluster     → 运行时状态跨实例共享
#   cache.type=redis        → 权限等业务缓存跨实例共享
#
# 多机 Admin 推荐同时开启：
# zestflow:
#   admin:
#     deploy-mode: cluster
#     cache:
#       type: redis
# spring:
#   data:
#     redis:
#       host: your-redis-host
#       port: 6379
#       password: your-redis-password
#       database: 0
