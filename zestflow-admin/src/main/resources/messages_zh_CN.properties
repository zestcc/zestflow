# ============ Auth ============
AUTH_INVALID_CREDENTIALS=用户名或密码错误
AUTH_USER_DISABLED=账号已被禁用
AUTH_USERNAME_EXISTS=用户名已存在
AUTH_EMAIL_EXISTS=邮箱已被注册
AUTH_USER_NOT_FOUND=用户不存在
AUTH_UNAUTHORIZED=未登录或登录已过期
AUTH_PASSWORD_INCORRECT=原密码错误

# ============ Mail ============
AUTH_INVALID_RESET_TOKEN=重置链接无效或已过期
MAIL_SEND_FAILED=邮件发送失败，请稍后重试
EMAIL_ALREADY_VERIFIED=邮箱已验证，无需重复验证
EMAIL_NOT_VERIFIED=邮箱未验证，请先验证邮箱

# ============ Common ============
VALIDATION_ERROR=参数校验失败
SERVER_ERROR=服务器内部错误

# ============ Application ============
MODULE_CODE_EXISTS=模块编码已存在
APP_NOT_FOUND=应用不存在

# ============ Permission ============
PERMISSION_DENIED=权限不足
SUPER_ADMIN_REQUIRED=需要超级管理员权限

# ============ Role ============
ROLE_NOT_FOUND=角色不存在

# ============ Chain ============
CHAIN_CODE_EXISTS=链编码已存在
CHAIN_NOT_FOUND=链不存在

# ============ Design ============
DESIGN_CODE_EXISTS=设计编码已存在
DESIGN_NOT_FOUND=设计不存在

# ============ Validation ============
NotBlank={0}不能为空
NotBlank.username=用户名不能为空
NotBlank.password=密码不能为空
NotBlank.email=邮箱不能为空
Email=邮箱格式不正确
Size={0}长度不正确
