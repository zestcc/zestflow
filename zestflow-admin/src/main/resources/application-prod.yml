server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/zestflow_admin?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 10000
      max-lifetime: 600000
  jackson:
    default-property-inclusion: non_null

zestflow:
  jwt:
    secret: ${JWT_SECRET:ZestFlow_admin_2024_JWT_Secret_Key_Must_Be_At_Least_256_Bits_Long_!!_}
    expiration: ${JWT_EXPIRATION:86400000}
  admin:
    default-user:
      username: ${ADMIN_USER:admin}
      password: ${ADMIN_PASS:admin123}
      email: ${ADMIN_EMAIL:admin@zestflow.com}
  collector:
    api-url: ${COLLECTOR_API_URL:http://localhost:8081}
    access-token: ${COLLECTOR_TOKEN:}

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.zestflow.admin.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

logging:
  level:
    com.zestflow: info
    org.springframework.security: warn
