# ============================================================
# Demo 演示环境配置 - 使用内存数据库
# ============================================================

spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: false
    out-of-order: true
    clean-disabled: false
  datasource:
    url: jdbc:h2:mem:zestflow_demo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver

zestflow:
  admin:
    cache:
      type: simple

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.zestflow: debug