# 公网 IP 试玩 Profile 示例
# 复制为 application-demo.yml，启动：--spring.profiles.active=demo
# ⚠ 勿与 prod 同开

zestflow:
  tenant:
    mode: multi
    ip-demo-mode: enabled
    ip-tenant-timeout-minutes: 60
    template-tenant-id: 1
    trial-lifecycle-enabled: true
    public-provision-enabled: true
  playground:
    enabled: true
