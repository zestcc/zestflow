<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f9ff"/>
      <stop offset="100%" stop-color="#f0f2ff"/>
    </linearGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#409eff"/>
      <stop offset="100%" stop-color="#667eea"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>

  <!-- 右侧装饰区：流程编排示意图 -->
  <g transform="translate(860, 160)" opacity="0.25">
    <!-- 连线 -->
    <g stroke="#667eea" stroke-width="1.5" fill="none" opacity="0.6">
      <path d="M40,60 L100,60 L100,150 L160,150"/>
      <path d="M40,60 L100,60 L100,220 L160,220"/>
      <path d="M40,60 L40,280 L100,280 L160,280"/>
      <path d="M40,60 L40,120 L10,120"/>
    </g>
    <!-- 节点 -->
    <g>
      <rect x="0" y="40" width="40" height="40" rx="8" fill="url(#g1)" opacity="0.3"/>
      <rect x="120" y="130" width="40" height="40" rx="8" fill="url(#g2)" opacity="0.25"/>
      <rect x="120" y="200" width="40" height="40" rx="8" fill="url(#g2)" opacity="0.25"/>
      <rect x="120" y="260" width="40" height="40" rx="8" fill="url(#g2)" opacity="0.25"/>
      <rect x="120" y="40" width="40" height="40" rx="8" fill="url(#g1)" opacity="0.2"/>
    </g>
  </g>

  <!-- 第二组编排图 -->
  <g transform="translate(160, 480)" opacity="0.18">
    <g stroke="#764ba2" stroke-width="1.5" fill="none" opacity="0.5">
      <path d="M30,30 L80,30 L80,80 L130,80"/>
      <path d="M30,30 L30,130 L80,130 L80,80"/>
      <path d="M30,30 L80,30 L80,180 L130,180"/>
    </g>
    <g>
      <circle cx="30" cy="30" r="18" fill="none" stroke="#764ba2" stroke-width="1.5" opacity="0.3"/>
      <circle cx="130" cy="80" r="14" fill="none" stroke="#764ba2" stroke-width="1.5" opacity="0.25"/>
      <circle cx="30" cy="130" r="14" fill="none" stroke="#764ba2" stroke-width="1.5" opacity="0.25"/>
      <circle cx="130" cy="180" r="14" fill="none" stroke="#764ba2" stroke-width="1.5" opacity="0.25"/>
    </g>
  </g>

  <!-- 第三组 — 左侧 -->
  <g transform="translate(100, 120)" opacity="0.12">
    <g stroke="#409eff" stroke-width="1" fill="none" opacity="0.4">
      <path d="M20,50 L70,50 L70,20 L120,20"/>
      <path d="M70,50 L70,100 L120,100"/>
    </g>
    <g>
      <circle cx="20" cy="50" r="10" fill="none" stroke="#409eff" stroke-width="1.2"/>
      <circle cx="120" cy="20" r="8" fill="none" stroke="#409eff" stroke-width="1.2"/>
      <circle cx="120" cy="100" r="8" fill="none" stroke="#409eff" stroke-width="1.2"/>
    </g>
  </g>
</svg>
